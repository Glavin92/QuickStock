<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill History - QuickStock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">Bill History</h1>
        
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-4 font-semibold text-gray-700">Bill Number</th>
                        <th class="px-6 py-4 font-semibold text-gray-700">Customer</th>
                        <th class="px-6 py-4 font-semibold text-gray-700">Date</th>
                        <th class="px-6 py-4 font-semibold text-gray-700">Total</th>
                        <th class="px-6 py-4 font-semibold text-gray-700">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                    {% for bill in bills %}
                    <tr class="hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-4 font-medium text-blue-600">{{ bill[1] }}</td>
                        <td class="px-6 py-4 text-gray-600">{{ bill[2] }}</td>
                        <td class="px-6 py-4 text-gray-500">{{ bill[5].strftime('%d %b, %Y') }}</td>
                        <td class="px-6 py-4 font-bold text-gray-800">₹{{ bill[3] }}</td>
                        <td class="px-6 py-4">
                            <a href="/billing/print/{{ bill[0] }}" target="_blank" class="text-blue-500 hover:text-blue-700 flex items-center gap-1">
                                🖨️ Print
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="mt-6 flex justify-between items-center">
            <a href="{{ url_for('bill_history', page=page-1) if page > 1 else '#' }}" class="px-4 py-2 bg-white border border-gray-300 rounded-lg {{ 'opacity-50 cursor-not-allowed' if page == 1 else 'hover:bg-gray-50' }}">
                Previous
            </a>
            <span class="text-gray-600">Page {{ page }}</span>
            <a href="{{ url_for('bill_history', page=page+1) }}" class="px-4 py-2 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                Next
            </a>
        </div>
    </div>
</body>
</html>
