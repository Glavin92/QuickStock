{% extends "base_auth.html" %}

{% block title %}Register - QuickStock{% endblock %}

{% block content %}
<div class="auth-card" style="max-width: 420px; padding: var(--space-6);">
    <div class="text-center mb-4">
        <h2>QuickStock Registration</h2>
        <p class="text-secondary mt-1">Join the next-gen inventory network</p>
    </div>
    
    {% if error %}
    <div class="mb-4" style="background: var(--danger-muted); color: var(--danger); padding: var(--space-3); border-radius: var(--radius-sm); font-size: 13px; text-align: center; border: 1px solid var(--danger);">
        {{ error }}
    </div>
    {% endif %}

    <form action="/register" method="POST" class="space-y-4">
        <div class="form-group mb-3">
            <label>Username</label>
            <input type="text" name="username" class="input-field" required>
        </div>
        <div class="form-group mb-3">
            <label>Password</label>
            <input type="password" name="password" class="input-field" required>
        </div>
        <div class="form-group mb-3">
            <label>Shop Name</label>
            <input type="text" name="shop_name" class="input-field" required>
        </div>
        <div class="form-group mb-3">
            <label>Phone Number</label>
            <input type="tel" name="phone" class="input-field" required>
        </div>
        <div class="form-group mb-3">
            <label>Shop Address</label>
            <input type="text" name="address" placeholder="Street, Area" class="input-field" required>
        </div>
        
        <div class="flex gap-3 mb-3">
            <div class="form-group w-full mb-0">
                <label>City</label>
                <input type="text" name="city" class="input-field" required>
            </div>
            <div class="form-group w-full mb-0">
                <label>PIN Code</label>
                <input type="text" name="pin_code" class="input-field" required>
            </div>
        </div>

        <input type="hidden" id="lat" name="latitude">
        <input type="hidden" id="lng" name="longitude">

        <div class="form-group mb-4">
            <button type="button" id="get-location-btn" onclick="getLocation()" class="btn" style="width: 100%; border: 1px dashed var(--border); color: var(--success);">
                <i data-lucide="map-pin" style="width: 16px; height: 16px;"></i>
                Auto-Detect My Location (Optional)
            </button>
            <p id="location-status" class="text-center text-secondary mt-1" style="font-size: 11px;"></p>
        </div>

        <button type="submit" class="btn btn-primary w-full" style="height: 36px; border-radius: var(--radius-md);">
            Register Shop
        </button>
    </form>
    
    <div class="text-center mt-4 pt-4" style="border-top: 1px solid var(--border);">
        <p class="text-secondary" style="font-size: 13px;">
            Already have an account? <a href="/login">Login here</a>
        </p>
    </div>
</div>

<script>
function getLocation() {
    const status = document.getElementById('location-status');
    if (!navigator.geolocation) {
        status.textContent = 'GPS not supported on this device.';
        return;
    }
    status.textContent = '📡 Detecting location...';
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            document.getElementById('lat').value = pos.coords.latitude;
            document.getElementById('lng').value = pos.coords.longitude;
            status.textContent = '✅ Location captured!';
            status.style.color = 'var(--success)';
        },
        (err) => {
            status.textContent = '⚠️ Could not auto-detect. Please enter PIN code manually.';
            status.style.color = 'var(--warning)';
        }
    );
}
</script>
{% endblock %}
