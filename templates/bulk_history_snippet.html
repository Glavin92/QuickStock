<!-- BULK RESTOCK HISTORY -->
<div class="card" style="margin-top: var(--space-6); padding: var(--space-5);">
    <div class="flex justify-between items-center mb-4">
        <h2 class="m-0" style="display: flex; align-items: center; gap: 8px;">
            <i data-lucide="package" style="width: 20px; height: 20px; color: var(--accent);"></i>
            Recent Bulk Restocks
        </h2>
        <button class="btn" onclick="loadBulkHistory()">
            <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i> Refresh
        </button>
    </div>
    <div id="bulk-history-container">
        <div class="text-center text-secondary py-5">
            <i data-lucide="inbox" style="width: 48px; height: 48px; margin: 0 auto var(--space-3) auto; opacity: 0.3;"></i>
            No bulk restock sessions yet.
        </div>
    </div>
</div>

<!-- JavaScript for Bulk History -->
<script>
    async function loadBulkHistory() {
        try {
            const res = await fetch('/bulk_restock_history');
            const data = await res.json();
            const container = document.getElementById('bulk-history-container');

            if (data.history && data.history.length > 0) {
                container.innerHTML = '';
                data.history.forEach(session => {
                    const itemsList = session.items_list.map(item => `<li style="margin-bottom: 4px;">${item}</li>`).join('');
                    container.innerHTML += `
                    <div style="margin-bottom: var(--space-4); padding: var(--space-4); border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-primary);">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <div style="font-weight: 600; font-size: 15px; color: var(--text-primary); display: flex; align-items: center; gap: 6px;">
                                    <i data-lucide="calendar" style="width: 14px; height: 14px; color: var(--text-secondary);"></i>
                                    ${session.date} at ${session.time}
                                </div>
                                <div style="color: var(--text-secondary); font-size: 13px; margin-top: 4px;">
                                    ${session.items_count} items added
                                </div>
                            </div>
                            <span class="badge badge-success">Completed</span>
                        </div>
                        <div style="background: var(--bg-secondary); padding: var(--space-3); border-radius: var(--radius-sm); border: 1px solid var(--border);">
                            <div style="font-weight: 600; font-size: 13px; margin-bottom: 8px; color: var(--text-primary);">Items:</div>
                            <ul style="margin: 0; padding-left: 18px; color: var(--text-secondary); font-size: 13px;">
                                ${itemsList}
                            </ul>
                        </div>
                    </div>
                `;
                });
                lucide.createIcons();
            } else {
                container.innerHTML = `
                <div class="text-center text-secondary py-5">
                    <i data-lucide="inbox" style="width: 48px; height: 48px; margin: 0 auto var(--space-3) auto; opacity: 0.3;"></i>
                    No bulk restock sessions yet.
                </div>
            `;
                lucide.createIcons();
            }
        } catch (e) {
            console.error('Failed to load bulk history:', e);
        }
    }

    // Load on page load
    document.addEventListener('DOMContentLoaded', () => {
        loadBulkHistory();
    });
</script>
