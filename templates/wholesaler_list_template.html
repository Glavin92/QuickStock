<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wholesalers - QuickStock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Available Wholesalers</h1>
            <a href="/dashboard" class="text-blue-600 hover:underline">Back to Dashboard</a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {% for w in wholesalers %}
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl font-bold text-gray-800">{{ w[1] }}</h2>
                        <p class="text-sm text-gray-500">{{ w[2] }} • {{ w[3] }}</p>
                    </div>
                    <span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold uppercase">Wholesaler</span>
                </div>
                <div class="space-y-4">
                    <div class="flex items-center gap-2 text-gray-600">
                        <i class="ri-phone-line"></i>
                        <span>{{ w[4] }}</span>
                    </div>
                    <form action="/wholesaler/order/create" method="POST" class="space-y-2">
                        <input type="hidden" name="wholesaler_id" value="{{ w[0] }}">
                        <textarea name="order_details" placeholder="What do you need to restock?" 
                            class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" required></textarea>
                        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors font-semibold">
                            Send Restock Order
                        </button>
                    </form>
                </div>
            </div>
            {% endfor %}
        </div>
        
        {% if not wholesalers %}
        <div class="bg-white p-12 rounded-xl text-center text-gray-500 border border-dashed border-gray-300">
            <i class="ri-store-2-line text-4xl mb-2 block"></i>
            No registered wholesalers found in your area yet.
        </div>
        {% endif %}
    </div>
</body>
</html>
