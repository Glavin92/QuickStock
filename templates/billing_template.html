<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bill - QuickStock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Create New Bill</h1>
            <a href="/dashboard" class="text-blue-600 hover:underline">Back to Dashboard</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Bill Form -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm space-y-4">
                    <h2 class="text-xl font-semibold mb-4">Customer Details</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="customer_name" placeholder="Customer Name" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <input type="tel" id="customer_phone" placeholder="Customer Phone" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm">
                    <h2 class="text-xl font-semibold mb-4">Add Items</h2>
                    <div class="flex gap-2 mb-6">
                        <select id="product_select" class="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">Select Product</option>
                            {% for name, prod in products.items() %}
                            <option value="{{ name }}" data-price="{{ prod.price }}" data-unit="{{ prod.unit }}">
                                {{ name }} (₹{{ prod.price }}/{{ prod.unit }})
                            </option>
                            {% endfor %}
                        </select>
                        <input type="number" id="item_qty" value="1" min="0.1" step="0.1" class="w-24 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <button onclick="addItem()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                            Add
                        </button>
                    </div>

                    <table class="w-full">
                        <thead>
                            <tr class="text-left border-bottom border-gray-100">
                                <th class="py-2">Product</th>
                                <th class="py-2 text-center">Qty</th>
                                <th class="py-2 text-right">Price</th>
                                <th class="py-2 text-right">Total</th>
                                <th class="py-2"></th>
                            </tr>
                        </thead>
                        <tbody id="bill_items_body">
                            <!-- Items added here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Right: Summary -->
            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-xl shadow-sm sticky top-8">
                    <h2 class="text-xl font-semibold mb-6 text-gray-800">Bill Summary</h2>
                    <div class="space-y-4">
                        <div class="flex justify-between text-gray-600">
                            <span>Subtotal</span>
                            <span id="summary_subtotal">₹0.00</span>
                        </div>
                        <div class="flex justify-between items-center gap-4">
                            <span class="text-gray-600">Discount</span>
                            <input type="number" id="bill_discount" value="0" onchange="updateSummary()" class="w-24 px-2 py-1 border rounded text-right">
                        </div>
                        <div class="flex justify-between items-center gap-4">
                            <span class="text-gray-600">GST %</span>
                            <input type="number" id="bill_gst_percent" value="0" onchange="updateSummary()" class="w-24 px-2 py-1 border rounded text-right">
                        </div>
                        <div class="pt-4 border-t border-gray-100 flex justify-between font-bold text-xl">
                            <span>Total</span>
                            <span id="summary_total" class="text-blue-600">₹0.00</span>
                        </div>
                        
                        <div class="space-y-2 pt-4">
                            <label class="text-sm font-semibold text-gray-600">Payment Method</label>
                            <select id="payment_method" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="cash">Cash</option>
                                <option value="upi">UPI/Online</option>
                                <option value="credit">Credit/Udhaar</option>
                            </select>
                        </div>

                        <button onclick="submitBill()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 transition-colors font-bold text-lg mt-6 flex items-center justify-center gap-2">
                            <i class="ri-checkbox-circle-line"></i> Generate Bill
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let billItems = [];

        function addItem() {
            const select = document.getElementById('product_select');
            const qtyInput = document.getElementById('item_qty');
            
            if (!select.value) return;

            const option = select.options[select.selectedIndex];
            const item = {
                product: select.value,
                qty: parseFloat(qtyInput.value),
                unit: option.dataset.unit,
                price: parseFloat(option.dataset.price)
            };

            billItems.push(item);
            renderItems();
            updateSummary();
            
            // Reset input
            select.value = "";
            qtyInput.value = 1;
        }

        function removeItem(index) {
            billItems.splice(index, 1);
            renderItems();
            updateSummary();
        }

        function renderItems() {
            const body = document.getElementById('bill_items_body');
            body.innerHTML = billItems.map((item, index) => `
                <tr class="border-t border-gray-50">
                    <td class="py-3 font-medium">${item.product}</td>
                    <td class="py-3 text-center text-gray-600">${item.qty} ${item.unit}</td>
                    <td class="py-3 text-right text-gray-600">₹${item.price}</td>
                    <td class="py-3 text-right font-bold">₹${(item.qty * item.price).toFixed(2)}</td>
                    <td class="py-3 text-right">
                        <button onclick="removeItem(${index})" class="text-red-500 hover:text-red-700">
                            <i class="ri-delete-bin-line"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function updateSummary() {
            const subtotal = billItems.reduce((sum, item) => sum + (item.qty * item.price), 0);
            const discount = parseFloat(document.getElementById('bill_discount').value) || 0;
            const gstPercent = parseFloat(document.getElementById('bill_gst_percent').value) || 0;
            
            const gstAmount = subtotal * (gstPercent / 100);
            const total = subtotal - discount + gstAmount;

            document.getElementById('summary_subtotal').textContent = `₹${subtotal.toFixed(2)}`;
            document.getElementById('summary_total').textContent = `₹${total.toFixed(2)}`;
        }

        async function submitBill() {
            if (billItems.length === 0) {
                alert('Please add at least one item');
                return;
            }

            const data = {
                customer_name: document.getElementById('customer_name').value || 'Walk-in Customer',
                customer_phone: document.getElementById('customer_phone').value,
                items: billItems,
                discount: document.getElementById('bill_discount').value,
                gst_percent: document.getElementById('bill_gst_percent').value,
                payment_method: document.getElementById('payment_method').value
            };

            try {
                const response = await fetch('/billing/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    window.location.href = `/billing/print/${result.bill_id}`;
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (err) {
                alert('Failed to generate bill');
                console.error(err);
            }
        }
    </script>
</body>
</html>
