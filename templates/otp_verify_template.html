<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - QuickStock</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Verify OTP</h2>
        
        <p class="text-sm text-gray-600 text-center mb-6">
            Enter the 6-digit OTP sent to <strong>{{ phone }}</strong>
        </p>

        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            Invalid or expired OTP. Please try again.
        </div>
        {% endif %}

        <form action="/login/otp/verify" method="POST" class="space-y-4">
            <div>
                <input type="text" name="otp" maxlength="6" class="w-full text-center text-2xl tracking-widest px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="000000" required autofocus>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors font-bold">
                Verify OTP
            </button>
        </form>
        
        <p class="mt-4 text-center text-sm text-gray-600">
            Didn't receive code? <a href="/login" class="text-blue-600 hover:underline">Try again</a>
        </p>
    </div>
</body>
</html>
