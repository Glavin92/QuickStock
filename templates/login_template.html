<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickStock | Secure Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --accent: #7c3aed;
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Gradients */
        .bg-gradient {
            position: absolute;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.15) 0%, transparent 40%);
            animation: drift 15s infinite alternate ease-in-out;
        }

        @keyframes drift {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.1);
            }
        }

        .login-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border);
            padding: 3.5rem;
            border-radius: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .brand i {
            font-size: 3rem;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .brand h1 {
            color: white;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.2rem;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 1.2rem 1.2rem 1.2rem 3.5rem;
            border-radius: 18px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
            outline: none;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.2);
        }

        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border: none;
            padding: 1.2rem;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(79, 70, 229, 0.4);
            filter: brightness(1.1);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .flash-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .footer-links {
            text-align: center;
            margin-top: 2rem;
            color: #64748b;
            font-size: 0.85rem;
        }

        .footer-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>

    <div class="login-card">
        <div class="brand">
            <i class="ri-voiceprint-fill"></i>
            <h1>QuickStock</h1>
            <p>Next-Gen Inventory Intelligence</p>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="flash-msg">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form action="/login" method="POST" id="password-form">
            <div class="form-group">
                <i class="ri-user-smile-line"></i>
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <i class="ri-lock-2-line"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Unlock System</button>
        </form>

        <!-- OTP Login Form (Hidden by default) -->
        <form action="/login/otp/send" method="POST" id="otp-form" style="display: none;">
            <div class="form-group">
                <i class="ri-smartphone-line"></i>
                <input type="tel" name="phone" placeholder="Registered Mobile Number" required>
            </div>
            <button type="submit" class="btn-login">Send OTP</button>
        </form>

        <div class="footer-links">
            <p id="toggle-text">Prefer OTP login? <a href="javascript:void(0)" onclick="toggleLogin()">Login with OTP</a></p>
            <p class="mt-2">New shopkeeper? <a href="/register">Register here</a></p>
            <p class="mt-2">&copy; 2026 QuickStock AI. <a href="#">Forgot access?</a></p>
        </div>

        <script>
            function toggleLogin() {
                const passForm = document.getElementById('password-form');
                const otpForm = document.getElementById('otp-form');
                const toggleText = document.getElementById('toggle-text');
                
                if (passForm.style.display === 'none') {
                    passForm.style.display = 'block';
                    otpForm.style.display = 'none';
                    toggleText.innerHTML = 'Prefer OTP login? <a href="javascript:void(0)" onclick="toggleLogin()">Login with OTP</a>';
                } else {
                    passForm.style.display = 'none';
                    otpForm.style.display = 'block';
                    toggleText.innerHTML = 'Prefer Password? <a href="javascript:void(0)" onclick="toggleLogin()">Login with Password</a>';
                }
            }
        </script>
    </div>
</body>

</html>
